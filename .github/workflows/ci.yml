name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same Node as Netlify: both read .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production dependencies must stay at 0 findings. The dev toolchain still has advisories
      # (webpack dev server, karma, @angular/build before 22.2) that only a later major clears.
      - name: npm audit (production)
        run: npm audit --omit=dev

      - name: Unit tests (Karma, headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadless

      - name: Production build
        run: npm run build
