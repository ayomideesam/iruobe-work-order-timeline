name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Same Node as Netlify: both read .nvmrc.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The whole tree, dev tooling included, stays at 0 findings.
      - name: npm audit
        run: npm audit

      - name: Unit tests (Vitest)
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build
